services:
  - type: web
    name: breathewise-urban-air-quality
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
